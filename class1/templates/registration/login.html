<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in | Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg-color:#0d0d0f;
  --card-bg:rgba(255,255,255,.03);
  --text-primary:#e8e6e1;
  --text-muted:#949086;
  --accent:#d4a373;
  --accent-glow:rgba(212,163,115,.15);
  --border-color:rgba(255,255,255,.07);
  --border-hover:rgba(212,163,115,.35);
  --err:#e8a0a0;
  --font-display:'Italiana',serif;
  --font-sans:'Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background-color:var(--bg-color);
  color:var(--text-primary);
  font-family:var(--font-sans);
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:max(2rem,env(safe-area-inset-top,0px)) 1.5rem max(2rem,env(safe-area-inset-bottom,0px));
  background-image:
    radial-gradient(circle at 15% 20%,rgba(212,163,115,.06) 0%,transparent 45%),
    radial-gradient(circle at 85% 80%,rgba(138,100,70,.05) 0%,transparent 50%);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none;transition:all .3s cubic-bezier(.16,1,.3,1)}

.login{width:100%;max-width:440px}
.brand{
  display:block;text-align:center;margin-bottom:2rem;
  font-family:var(--font-display);font-size:2.2rem;letter-spacing:1px;color:var(--text-primary);
}

.card{
  background:var(--card-bg);
  border:1px solid var(--border-color);
  border-radius:20px;
  padding:3rem 2.5rem;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  position:relative;overflow:hidden;
  transition:all .4s cubic-bezier(.16,1,.3,1);
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0;transition:opacity .4s ease;
}
.card:focus-within{
  border-color:var(--border-hover);
  box-shadow:0 20px 40px rgba(0,0,0,.4),0 0 30px var(--accent-glow);
}
.card:focus-within::before{opacity:1}

h1{
  font-family:var(--font-display);font-size:2.4rem;line-height:1.25;font-weight:400;
  letter-spacing:.5px;margin-bottom:.5rem;
}
.sub{font-size:.95rem;color:var(--text-muted);font-weight:300;margin-bottom:2rem}

label.lbl{
  display:block;margin-bottom:.4rem;
  font-size:.75rem;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);
}
.field{margin-bottom:1.25rem}
.wrap{position:relative}
input[type=text],input[type=password]{
  width:100%;padding:.9rem 1.1rem;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border-color);border-radius:12px;
  font-family:inherit;font-size:.9rem;color:var(--text-primary);
  outline:none;transition:all .3s ease;
}
input::placeholder{color:var(--text-muted);opacity:.6}
input[type=text]:focus,input[type=password]:focus{
  border-color:var(--accent);background:rgba(255,255,255,.06);
}
.wrap input[type=password],.wrap input.shown{padding-right:4.5rem}
.toggle{
  position:absolute;right:.5rem;top:50%;transform:translateY(-50%);
  background:none;border:0;cursor:pointer;padding:.5rem .7rem;border-radius:8px;
  font-family:inherit;font-size:.7rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-muted);transition:color .3s ease;
}
.toggle:hover{color:var(--accent)}

.row{
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  margin:.5rem 0 1.75rem;font-size:.85rem;font-weight:300;
}
.remember{display:flex;align-items:center;gap:.6rem;color:var(--text-muted);cursor:pointer}
.remember input{accent-color:var(--accent);width:15px;height:15px}
.row a,.foot a{color:var(--accent);font-weight:500}
.row a:hover,.foot a:hover{opacity:.8}

button.submit{
  width:100%;padding:.95rem;
  background:var(--accent);color:#0d0d0f;border:none;border-radius:12px;
  font-family:inherit;font-size:.75rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;transition:all .3s ease;
}
button.submit:hover{opacity:.9;box-shadow:0 0 20px var(--accent-glow)}
button.submit:active{transform:scale(.99)}

.msg{min-height:1.4em;margin-top:1rem;text-align:center;font-size:.85rem;color:var(--err)}
.foot{margin-top:1.5rem;text-align:center;font-size:.85rem;color:var(--text-muted);font-weight:300}

.toggle:focus-visible,button.submit:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:800px){
  .card{padding:2rem 1.5rem}
  h1{font-size:1.9rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="login">
  <a class="brand" href="/">LUMEN.</a>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue to your account.</p>

    <form id="f" method="post" action="" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="field">
        <label class="lbl" for="user">Username</label>
        <input id="user" name="username" type="text" value="{{ form.username.value|default:'' }}" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>

      <div class="field">
        <label class="lbl" for="pw">Password</label>
        <div class="wrap">
          <input id="pw" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="t" aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" name="remember_me"> Keep me signed in</label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="submit" type="submit">Sign in</button>

      <p class="msg" id="m" role="alert">{% if form.errors %}Incorrect username or password.{% endif %}{% for message in messages %}{{ message }}{% endfor %}</p>
    </form>

    <p class="foot">New here? <a href="{% url 'register' %}">Create an account</a></p>
  </div>
</div>

<script>
const pw=document.getElementById('pw'),t=document.getElementById('t'),m=document.getElementById('m');
t.onclick=()=>{
  const h=pw.type==='password';
  pw.type=h?'text':'password';
  pw.classList.toggle('shown',h);
  t.textContent=h?'Hide':'Show';
  t.setAttribute('aria-label',h?'Hide password':'Show password');
};
document.getElementById('f').addEventListener('submit',e=>{
  if(!document.getElementById('user').value.trim()){e.preventDefault();m.textContent='Enter your username.';return}
  if(!pw.value){e.preventDefault();m.textContent='Enter your password.';return}
});
</script>
</body>
</html>
